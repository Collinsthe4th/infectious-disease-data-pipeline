name: Update reference data

# Downloads state populations (HDX) and state boundaries (geoBoundaries) and commits them
# to data/reference/. Run by hand: Actions -> Update reference data -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_reference_data.py", ".github/workflows/update-reference.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python scripts/update_reference_data.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update reference data (HDX population, state boundaries)"
          git pull --rebase origin main && git push
