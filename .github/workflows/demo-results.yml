name: Demo results report

# Runs the whole pipeline on the SYNTHETIC demo in a throwaway database and
# commits results/README.md (+ charts) so the analysed data and model results
# can be read on GitHub. Actions tab -> Demo results report -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "scripts/make_results_report.py", ".github/workflows/demo-results.yml"]

permissions:
  contents: write

concurrency:
  group: demo-results
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: demo, POSTGRES_PASSWORD: demo, POSTGRES_DB: demo }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U demo" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://demo:demo@localhost:5432/demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run the pipeline on the synthetic demo (ingest -> parse -> validate -> store -> analyse)
        run: python -m src.orchestration.cli --plain-logs demo
      - name: Write the results page
        run: python scripts/make_results_report.py --out results
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update demo results report"
          git pull --rebase origin main && git push
