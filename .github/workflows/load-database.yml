name: Load data into Supabase

# Fills YOUR database (the one the Streamlit dashboard reads) without needing a computer.
# One-time setup: Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: DATABASE_URL   Value: your Supabase *Session pooler* connection string
# Then: Actions tab -> Load data into Supabase -> Run workflow -> choose what to load.

on:
  schedule:
    - cron: "17 5 * * 1"   # every Monday ~06:17 Nigeria time: the normal weekly run (free, always on)
  workflow_dispatch:
    inputs:
      what:
        description: "What to load"
        type: choice
        default: real-weekly
        options:
          - real-weekly              # a normal weekly run against ncdc.gov.ng
          - real-trial               # 3 newest real NCDC reports per disease
          - real-backfill            # full 2021-2026 history (several hours; safe to re-run, it resumes)
          - analytics-only           # recompute trends, alerts and forecasts
          - remove-synthetic-data    # delete demo data, keep real data (safe while another load runs)
          - demo                     # synthetic data, every feature (refuses if real data is present)
          - RESET-then-real-trial    # DELETES everything, then a real trial
          - RESET-then-real-backfill # DELETES everything, then the full real history
      confirm:
        description: "For the RESET options only: type DELETE"
        default: ""

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: ${{ github.event.inputs.what == 'remove-synthetic-data' && 'database-cleanup' || 'database-load' }}
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Check the secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the DATABASE_URL repository secret first (see the top of this file)"; exit 1; fi
      - name: Create tables (safe to repeat)
        run: python -m src.orchestration.cli --plain-logs init-db
      - name: Reset (only for the RESET options)
        if: startsWith(github.event.inputs.what, 'RESET')
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DELETE" ]; then
            echo "::error::Type DELETE in the confirm box to reset the database."; exit 1
          fi
          python -m src.orchestration.cli --plain-logs reset-db --yes
      - name: Load
        run: |
          case "${{ github.event.inputs.what || 'real-weekly' }}" in
            RESET-then-real-trial)    python -m src.orchestration.cli --plain-logs backfill --max-files 3 ;;
            RESET-then-real-backfill) python -m src.orchestration.cli --plain-logs backfill ;;
            demo)           python -m src.orchestration.cli --plain-logs demo ;;
            real-trial)     python -m src.orchestration.cli --plain-logs backfill --max-files 3 ;;
            real-weekly)    python -m src.orchestration.cli --plain-logs run ;;
            real-backfill)  python -m src.orchestration.cli --plain-logs backfill ;;
            analytics-only) python -m src.orchestration.cli --plain-logs analytics ;;
            remove-synthetic-data) python -m src.orchestration.cli --plain-logs purge-synthetic ;;
          esac
      - name: Summary
        if: always()
        run: python -m src.orchestration.cli --plain-logs status | tee -a "$GITHUB_STEP_SUMMARY"
