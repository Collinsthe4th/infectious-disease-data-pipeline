name: Research samples (state tables)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y -qq tesseract-ocr > /dev/null
      - run: pip install requests beautifulsoup4 pdfplumber pandas
      - run: python scripts/render_state_tables.py
      - name: Push images to the 'research-samples' branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b research-samples
          git add -f research/samples
          git commit -m "Lassa Table 3 samples"
          git push -f origin research-samples
