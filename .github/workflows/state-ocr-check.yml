name: State table OCR check

# Reads a spread of real Lassa fever reports and shows whether the state table
# (an image in the PDF) was read correctly. Nothing is written to the database.
on:
  workflow_dispatch:
    inputs:
      reports:
        description: "How many reports to check"
        default: "12"
      dump:
        description: "Save failing pages to the 'ocr-debug' branch"
        type: boolean
        default: false
  push:
    paths: ["src/extraction/state_table_ocr.py", "scripts/check_state_ocr.py"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get install -y -qq tesseract-ocr > /dev/null
      - run: pip install -r requirements.txt
      - run: python scripts/check_state_ocr.py ${{ github.event.inputs.reports || '12' }} ${{ github.event.inputs.dump == 'true' && 'ocr-debug' || '' }}
      - name: Save failing pages to the 'ocr-debug' branch
        if: github.event.inputs.dump == 'true'
        run: |
          git config user.name "Akagha Collins Chisom"
          git config user.email "173009974+Collinsthe4th@users.noreply.github.com"
          git checkout -b ocr-debug
          git add -f ocr-debug
          git commit -qm "Saved state table pages that failed the OCR checks"
          git push -f origin ocr-debug
