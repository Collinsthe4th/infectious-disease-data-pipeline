name: Results report

# Writes results/README.md (+ charts) from the REAL data in Supabase, after every
# database load, so the analysed data and model results can be read on GitHub.
# Needs the DATABASE_URL repository secret. Synthetic demo rows are never included.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Load data into Supabase"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: results-report
  cancel-in-progress: true

jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Write the results page
        run: |
          rm -rf results/figures
          python scripts/make_results_report.py --out results
      - name: Commit results
        run: |
          git config user.name "Akagha Collins Chisom"
          git config user.email "173009974+Collinsthe4th@users.noreply.github.com"
          git add -A results
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update results report (real NCDC data)"
          git pull --rebase origin main && git push
