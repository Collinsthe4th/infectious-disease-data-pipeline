name: Evaluation tests (read-only)

# Measures the pipeline for Chapter 4: run time and reliability, data quality, revisions (RQ2),
# alert timing, an extraction audit sample with PDF page images (RQ1), and the live dashboard's
# load time and displayed values. Nothing in the database is changed. Results are saved to the
# 'evaluation-results' branch.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "Which tests"
        type: choice
        default: all
        options: [all, db, sample, dashboard, "db,dashboard"]
      sample_size:
        description: "Reports in the extraction audit sample"
        default: "30"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: https://infectious-disease-data-pipeline.streamlit.app
      WHAT: ${{ github.event.inputs.what || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium > /dev/null
      - name: Database analyses
        if: env.WHAT == 'all' || contains(env.WHAT, 'db')
        run: python scripts/evaluation_tests.py db evaluation
      - name: Extraction audit sample
        if: env.WHAT == 'all' || contains(env.WHAT, 'sample')
        run: python scripts/evaluation_tests.py sample evaluation/extraction ${{ github.event.inputs.sample_size || '30' }}
      - name: Live dashboard
        if: env.WHAT == 'all' || contains(env.WHAT, 'dashboard')
        run: python scripts/evaluation_tests.py dashboard evaluation/dashboard "$APP_URL"
      - name: Save to the 'evaluation-results' branch
        if: always()
        run: |
          git config user.name "Akagha Collins Chisom"
          git config user.email "173009974+Collinsthe4th@users.noreply.github.com"
          mv evaluation /tmp/evaluation-new
          if git fetch -q origin evaluation-results; then git checkout -q -B evaluation-results FETCH_HEAD
          else git checkout -q --orphan evaluation-results && git rm -rqf --cached . && git clean -fdxq -e .git; fi
          mkdir -p evaluation && cp -r /tmp/evaluation-new/. evaluation/   # new results replace the same files
          git add -f evaluation
          git commit -qm "Saved evaluation results ($WHAT, $(date -u +%F))" && git push -q origin evaluation-results
