[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infectious-disease-data-pipeline"
version = "0.1.0"
description = "Automated data pipeline that monitors and analyzes infectious disease trends in Nigeria (NCDC reports)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Akagha Collins Chisom" }]
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.scripts]
pipeline = "src.orchestration.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.storage" = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: needs a PostgreSQL database in TEST_DATABASE_URL",
  "slow: takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]
log_level = "INFO"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"dashboard/**" = ["I001", "E402"]
"tests/**" = ["E731"]
